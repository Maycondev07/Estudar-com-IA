<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Treineiro — Início</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .chat-wrap {
      max-width: 820px;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      height: calc(100vh - 65px);
    }
    .controls-bar {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 16px 40px 0;
      flex-wrap: wrap;
    }
    .controls-bar .field-inline {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .seg {
      display: flex;
      border: 1px solid var(--line);
      border-radius: 4px;
      overflow: hidden;
    }
    .seg button {
      background: transparent;
      border: none;
      color: var(--ink-dim);
      padding: 7px 12px;
      font-size: 13px;
      cursor: pointer;
      border-right: 1px solid var(--line);
    }
    .seg button:last-child { border-right: none; }
    .seg button.active {
      background: var(--panel-raised);
      color: var(--ink);
    }
    .messages {
      flex: 1;
      overflow-y: auto;
      padding: 24px 40px;
    }
    .msg-row {
      display: flex;
      gap: 18px;
      padding: 16px 0;
      border-bottom: 1px solid var(--line);
    }
    .msg-role {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.5px;
      color: var(--ink-dim);
      width: 70px;
      flex-shrink: 0;
      padding-top: 3px;
    }
    .msg-role.user { color: var(--accent); }
    .msg-content {
      white-space: pre-wrap;
      line-height: 1.6;
      font-size: 15.5px;
    }
    .composer {
      border-top: 1px solid var(--line);
      background: var(--panel);
      padding: 16px 40px 26px;
      display: flex;
      gap: 10px;
    }
    .composer textarea {
      flex: 1;
      resize: none;
      background: var(--panel-raised);
      border: 1px solid var(--line);
      border-radius: 4px;
      color: var(--ink);
      padding: 12px 14px;
      font-size: 14.5px;
      line-height: 1.5;
      outline: none;
    }
    .save-banner {
      margin: 0 40px 12px;
      padding: 12px 14px;
      border: 1px solid var(--accent);
      border-radius: 4px;
      font-size: 13.5px;
      display: none;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }
    .error-banner {
      margin: 0 40px 12px;
      padding: 12px 14px;
      border: 1px solid var(--red);
      border-radius: 4px;
      font-size: 13.5px;
      display: none;
    }
  </style>
</head>
<body>
  <div id="navbar" class="navbar"></div>

  <div class="chat-wrap">
    <div class="controls-bar">
      <span class="label">modo</span>
      <div class="seg" id="mode-seg">
        <button data-mode="livre" class="active">diagnóstico / estudo</button>
        <button data-mode="simulado">simulado</button>
      </div>
      <div id="difficulty-wrap" class="field-inline" style="display:none">
        <span class="label">dificuldade</span>
        <div class="seg" id="difficulty-seg">
          <button data-diff="aprendizado">🟩 aprendizado</button>
          <button data-diff="intermediario">🟨 intermediário</button>
          <button data-diff="prova_real">🟥 prova real</button>
        </div>
      </div>
    </div>

    <div id="save-banner" class="save-banner">
      <span>Percebi uma pontuação nessa correção. Quer salvar esse simulado na página "Simulados"?</span>
      <div style="display:flex; gap:8px; flex-shrink:0">
        <button class="btn btn-primary" id="save-yes" style="padding:6px 12px; font-size:13px">Salvar</button>
        <button class="btn" id="save-no" style="padding:6px 12px; font-size:13px">Ignorar</button>
      </div>
    </div>
    <div id="error-banner" class="error-banner"></div>

    <div class="messages" id="messages"></div>

    <div class="composer">
      <textarea id="input" rows="2" placeholder="Escreva sua resposta ou pergunta…"></textarea>
      <button class="btn btn-primary" id="send-btn">Enviar</button>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/chat.js"></script>
</body>
</html>
