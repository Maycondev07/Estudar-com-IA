<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Treineiro — Matérias</title>
  <link rel="stylesheet" href="css/style.css" />
  <style>
    .add-row {
      display: flex;
      gap: 10px;
      margin-bottom: 10px;
      flex-wrap: wrap;
      align-items: center;
    }
    .add-row input[type="text"] { flex: 1; min-width: 200px; }
    .add-row select { width: 220px; flex-shrink: 0; }
    .add-row .dominio-field {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-shrink: 0;
    }
    .add-row input[type="range"] { width: 130px; }
    .add-row .dominio-num { font-family: var(--mono); font-size: 12.5px; width: 38px; text-align: right; }
    .add-hint { color: var(--ink-dim); font-size: 12.5px; margin-bottom: 22px; }

    .materia-row { align-items: center; }
    .materia-nome { flex: 1; font-size: 15px; }
    .materia-nome.sub { font-size: 13.5px; color: var(--ink-dim); }
    .bar-track {
      width: 120px;
      height: 6px;
      border-radius: 3px;
      background: var(--panel-raised);
      overflow: hidden;
      flex-shrink: 0;
    }
    .bar-fill { height: 100%; border-radius: 3px; }
    .dominio-slider { width: 120px; flex-shrink: 0; }
    .dominio-num { font-family: var(--mono); font-size: 12.5px; width: 36px; text-align: right; flex-shrink: 0; }
    .sub-list { margin: 2px 0 10px 30px; border-left: 2px solid var(--line); padding-left: 14px; }
    .add-sub-btn {
      background: none;
      border: none;
      color: var(--accent);
      cursor: pointer;
      font-size: 12px;
      padding: 4px 6px;
      flex-shrink: 0;
    }
  </style>
</head>
<body>
  <div id="navbar" class="navbar"></div>

  <div class="page">
    <h1 class="page-title">Matérias</h1>
    <p class="page-subtitle">Organize as matérias da sua prova (e, se quiser, ramifique em submatérias) e ajuste o domínio real em cada uma, de 0% a 100%. Isso alimenta a árvore de skills na página Perfil.</p>

    <div class="add-row" id="add-row">
      <input type="text" id="nova-materia" placeholder="Nome da matéria ou submatéria" />
      <select id="novo-pai">
        <option value="">— matéria própria (nível raiz) —</option>
      </select>
      <div class="dominio-field">
        <input type="range" id="novo-dominio" min="0" max="100" value="50" />
        <span class="dominio-num" id="novo-dominio-label">50%</span>
      </div>
      <button class="btn btn-primary" id="add-btn">Adicionar</button>
    </div>
    <p class="add-hint">Escolha uma matéria em "dentro de" pra criar uma submatéria (ex: "Funções" dentro de "Matemática").</p>

    <div class="panel" id="lista"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/supabaseClient.js"></script>
  <script src="js/auth.js"></script>
  <script src="js/authGate.js"></script>
  <script src="js/storage.js"></script>
  <script src="js/nav.js"></script>
  <script src="js/skillTree.js"></script>
  <script src="js/materias.js"></script>
</body>
</html>
